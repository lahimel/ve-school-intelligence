<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VE School Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 42px 38px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #94a3b8;
        }

        .security-note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                VE
            </div>

            <h1>VE School Intelligence</h1>

            <p class="subtitle">
                Vocational Education<br>
                School Intelligence Portal
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="employeeCode">
                        Employee Code
                    </label>

                    <input
                        type="text"
                        id="employeeCode"
                        placeholder="Enter your employee code"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>

                <div
                    class="message"
                    id="message"
                ></div>

            </form>

            <div class="security-note">
                🔒 Authorized employees only
            </div>

            <div class="footer">
                Vocational Education Programme
            </div>

        </div>

    </div>

</body>
</html>
